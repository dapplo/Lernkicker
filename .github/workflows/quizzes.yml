name: Validate quizzes and lessons

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "quizzes/**"
      - "lessons/**"
      - "schema/**"
      - "tools/validate_quizzes.py"
      - ".github/workflows/quizzes.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0
      - run: python3 tools/validate_quizzes.py
